<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit book</title>
</head>
<body>

    <h1>Edit book</h1>

    <form th:action="@{/savebook/{id}(id=${book.id})}" method="post">

        <div>
            <label>Title:</label>
            <input type="text" name="title" th:value="${book.title}">
        </div>

        <div>
            <label>Author:</label>
            <input type="text" name="author" th:value="${book.author}">
        </div>

        <div>
            <label>Publication year:</label>
            <input type="number" name="publicationYear" th:value="${book.publicationYear}">
        </div>

        <div>
            <label>ISBN:</label>
            <input type="text" name="isbn" th:value="${book.isbn}">
        </div>

        <div>
            <label>Price:</label>
            <input type="number" step="0.01" name="price" th:value="${book.price}">
        </div>

        <button type="submit">Save changes</button>

    </form>

</body>
</html>
